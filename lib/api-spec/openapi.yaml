openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Chores Your Own Adventure API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: parties
    description: Party management
  - name: characters
    description: Character creation and customization
  - name: quests
    description: Quest management
  - name: shop
    description: Shop and purchases
  - name: inventory
    description: Inventory and equipment
  - name: partyGoals
    description: Party goals and party gold
  - name: projects
    description: Projects and boss battles
  - name: catFoley
    description: Cat Foley merchant
  - name: schoolCalendars
    description: School calendars
  - name: ai
    description: AI features
  - name: admin
    description: Admin tools
  - name: home
    description: Home dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerAdult
      tags: [auth]
      summary: Register adult account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginAdult
      tags: [auth]
      summary: Login adult account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/household/{code}/adventurers:
    get:
      operationId: getHouseholdAdventurers
      tags: [auth]
      summary: Get adventurers for a household code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of adventurers in household
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdventurerCard"
        "404":
          description: Household code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/kid-login:
    post:
      operationId: loginKid
      tags: [auth]
      summary: Login kid with household code and PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KidLoginInput"
      responses:
        "200":
          description: Kid logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid PIN or locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: PIN attempts locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinLockResponse"

  /auth/change-pin:
    post:
      operationId: changePIN
      tags: [auth]
      summary: Change kid PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePINInput"
      responses:
        "200":
          description: PIN changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid old PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── HOME ────────────────────────────────────────────────────────────────────
  /home:
    get:
      operationId: getHomeData
      tags: [home]
      summary: Get home screen data for current user and active party
      responses:
        "200":
          description: Home data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"

  /home/give-me-a-quest:
    get:
      operationId: giveMeAQuest
      tags: [home]
      summary: Get the highest priority quest for the current user
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Suggested quest or empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiveMeAQuestResult"

  # ─── PARTIES ─────────────────────────────────────────────────────────────────
  /parties:
    get:
      operationId: listMyParties
      tags: [parties]
      summary: List parties the current user belongs to
      responses:
        "200":
          description: List of parties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyOverview"
    post:
      operationId: createParty
      tags: [parties]
      summary: Create a new party
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "201":
          description: Created party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"

  /parties/{partyId}:
    get:
      operationId: getParty
      tags: [parties]
      summary: Get party details
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Party details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
    patch:
      operationId: updateParty
      tags: [parties]
      summary: Update party settings
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyUpdate"
      responses:
        "200":
          description: Updated party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
    delete:
      operationId: deleteParty
      tags: [parties]
      summary: Delete a party (founder only)
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Party deleted

  /parties/{partyId}/members:
    get:
      operationId: listPartyMembers
      tags: [parties]
      summary: List party members
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyMember"
    post:
      operationId: addKidMember
      tags: [parties]
      summary: Add a kid adventurer to a party (leader only)
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KidMemberInput"
      responses:
        "201":
          description: Kid member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyMember"

  /parties/{partyId}/members/{userId}:
    patch:
      operationId: updatePartyMember
      tags: [parties]
      summary: Update member role or PIN reset
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
        - name: userId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyMember"
    delete:
      operationId: removePartyMember
      tags: [parties]
      summary: Remove member from party
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
        - name: userId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Member removed

  /parties/{partyId}/invite:
    post:
      operationId: createInvite
      tags: [parties]
      summary: Create an invite link or code
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /parties/{partyId}/pause-routines:
    post:
      operationId: pauseRoutineQuests
      tags: [parties]
      summary: Pause or resume all routine quests for a party
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseRoutinesInput"
      responses:
        "200":
          description: Paused/resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /parties/{partyId}/summon-cat-foley:
    post:
      operationId: summonCatFoley
      tags: [catFoley]
      summary: Summon Cat Foley (leader only)
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Cat Foley summoned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatFoleyVisit"
        "409":
          description: Already visiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parties/{partyId}/transfer-founder:
    post:
      operationId: transferFounder
      tags: [parties]
      summary: Transfer founder status to another leader
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferFounderInput"
      responses:
        "200":
          description: Founder transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /parties/{partyId}/leave:
    post:
      operationId: leaveParty
      tags: [parties]
      summary: Leave a party
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Left party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /parties/join:
    post:
      operationId: joinParty
      tags: [parties]
      summary: Join a party via invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinPartyInput"
      responses:
        "200":
          description: Joined party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"

  # ─── CHARACTER ───────────────────────────────────────────────────────────────
  /party-recap:
    get:
      operationId: getPartyRecap
      tags: [parties]
      summary: Recap of a member's (or whole party's) accomplishments in a time window (adults/leaders only)
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: number
        - name: userId
          in: query
          required: false
          schema:
            type: number
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: tzOffset
          in: query
          required: false
          description: Viewer timezone offset in minutes (JS Date.getTimezoneOffset())
          schema:
            type: number
      responses:
        "200":
          description: Recap summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapResponse"

  /character:
    get:
      operationId: getMyCharacter
      tags: [characters]
      summary: Get current user's character
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    put:
      operationId: saveCharacter
      tags: [characters]
      summary: Create or update character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Saved character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "429":
          description: Cooldown active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CooldownResponse"

  /character/users/{userId}:
    get:
      operationId: getUserCharacter
      tags: [characters]
      summary: Get another user's public character
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  # ─── QUESTS ──────────────────────────────────────────────────────────────────
  /quests:
    get:
      operationId: listQuests
      tags: [quests]
      summary: List quest definitions for a party
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: number
        - name: type
          in: query
          schema:
            type: string
            enum: [individual, open, party, recurring, one_time, paused, pending_verification, legendary]
      responses:
        "200":
          description: List of quest definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestDefinition"
    post:
      operationId: createQuest
      tags: [quests]
      summary: Create a quest definition (leader only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestDefinitionInput"
      responses:
        "201":
          description: Quest created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDefinition"

  /quests/{questId}:
    get:
      operationId: getQuest
      tags: [quests]
      summary: Get quest definition
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quest definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDefinition"
    patch:
      operationId: updateQuest
      tags: [quests]
      summary: Update a quest definition
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestDefinitionUpdate"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDefinition"
    delete:
      operationId: deleteQuest
      tags: [quests]
      summary: Delete a quest definition
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /quests/{questId}/pause:
    post:
      operationId: toggleQuestPause
      tags: [quests]
      summary: Toggle pause on a recurring quest
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseQuestInput"
      responses:
        "200":
          description: Pause toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDefinition"

  /quest-assignments:
    get:
      operationId: listMyQuestAssignments
      tags: [quests]
      summary: List active quest assignments for current user in a party
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Active quest assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestAssignment"

  /quest-assignments/{assignmentId}/complete:
    post:
      operationId: completeQuest
      tags: [quests]
      summary: Mark a quest assignment as complete
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quest completed with reward summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestRewardResult"
        "409":
          description: Already completed or not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quest-assignments/{assignmentId}/submit-verification:
    post:
      operationId: submitVerification
      tags: [quests]
      summary: Submit quest for leader verification
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Submitted for verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestAssignment"

  /quest-assignments/{assignmentId}/verify:
    post:
      operationId: verifyQuest
      tags: [quests]
      summary: Approve or reject a quest verification (leader)
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyQuestInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestRewardResult"

  /open-quests:
    get:
      operationId: listOpenQuests
      tags: [quests]
      summary: List available open quests in a party
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Open quests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestAssignment"

  /open-quests/{assignmentId}/claim:
    post:
      operationId: claimOpenQuest
      tags: [quests]
      summary: Claim an open quest
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quest claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestAssignment"
        "409":
          description: Already have a claimed quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /open-quests/{assignmentId}/release:
    post:
      operationId: releaseOpenQuest
      tags: [quests]
      summary: Release a claimed open quest
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quest released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /quests/pending-verification:
    get:
      operationId: listPendingVerification
      tags: [quests]
      summary: List quests awaiting verification (leader only)
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pending verifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestAssignment"

  /quests/proposed:
    get:
      operationId: listProposedQuests
      tags: [quests]
      summary: List adventurer-proposed quests (leader view)
      parameters:
        - name: partyId
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Proposed quests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestDefinition"

  /quests/propose:
    post:
      operationId: proposeQuest
      tags: [quests]
      summary: Adventurer proposes a new quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestProposalInput"
      responses:
        "201":
          description: Quest proposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDefinition"

  /quests/{questId}/review-proposal:
    post:
      operationId: reviewQuestProposal
      tags: [quests]
      summary: Leader approves/declines/changes difficulty of proposed quest
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestProposalReview"
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDefinition"

  /quests/{questId}/duplicate:
    post:
      operationId: duplicateQuest
      tags: [quests]
      summary: Duplicate a quest definition
      parameters:
        - name: questId
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":

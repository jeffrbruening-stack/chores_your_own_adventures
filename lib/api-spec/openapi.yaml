components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    RecapQuest:
      type: object
      required: [assignmentId, title, completedAt, xpAwarded, goldAwarded]
      properties:
        assignmentId:
          type: number
        title:
          type: string
        adventureTitle:
          type: ["string", "null"]
        completedAt:
          type: string
        xpAwarded:
          type: number
        goldAwarded:
          type: number
        userId:
          type: ["number", "null"]
        userName:
          type: ["string", "null"]

    RecapDay:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
        count:
          type: number

    RecapResponse:
      type: object
      required: [from, to, questsCompleted, totalAssigned, completedCount, completionRate, xpEarned, goldEarned, levelUps, byDay]
      properties:
        from:
          type: string
        to:
          type: string
        userId:
          type: ["number", "null"]
        userName:
          type: ["string", "null"]
        questsCompleted:
          type: array
          items:
            $ref: "#/components/schemas/RecapQuest"
        totalAssigned:
          type: number
        completedCount:
          type: number
        completionRate:
          type: number
        xpEarned:
          type: number
        goldEarned:
          type: number
        levelUps:
          type: number
        currentLevel:
          type: ["number", "null"]
        byDay:
          type: array
          items:
            $ref: "#/components/schemas/RecapDay"

    # ─── AUTH SCHEMAS ──────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    KidLoginInput:
      type: object
      required: [householdCode, userId, pin]
      properties:
        householdCode:
          type: string
        userId:
          type: number
        pin:
          type: string
          minLength: 4
          maxLength: 4

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    ChangePINInput:
      type: object
      required: [oldPin, newPin]
      properties:
        oldPin:
          type: string
          minLength: 4
          maxLength: 4
        newPin:
          type: string
          minLength: 4
          maxLength: 4

    AuthResult:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string

    UserProfile:
      type: object
      required: [id, displayName, userType, isAppAdmin, lifetimeXp, currentLevel, personalGold, adventureMode, soundEnabled, hapticsEnabled]
      properties:
        id:
          type: number
        email:
          type: ["string", "null"]
        displayName:
          type: string
        adventurerName:
          type: ["string", "null"]
        userType:
          type: string
          enum: [adult, kid]
        isAppAdmin:
          type: boolean
        lifetimeXp:
          type: number
        currentLevel:
          type: number
        highestLevel:
          type: number
        personalGold:
          type: number
        legendaryCompletions:
          type: number
        adventureMode:
          type: boolean
        soundEnabled:
          type: boolean
        hapticsEnabled:
          type: boolean
        characterCooldownUntil:
          type: ["string", "null"]
        activePartyId:
          type: ["number", "null"]
        createdAt:
          type: string

    AdventurerCard:
      type: object
      required: [id, displayName, level]
      properties:
        id:
          type: number
        displayName:
          type: string
        adventurerName:
          type: ["string", "null"]
        level:
          type: number
        species:
          type: ["string", "null"]
        class:
          type: ["string", "null"]
        avatarColor:
          type: ["string", "null"]

    PinLockResponse:
      type: object
      required: [error, lockedUntil]
      properties:
        error:
          type: string
        lockedUntil:
          type: string

    # ─── HOME SCHEMAS ──────────────────────────────────────────────────────────
    HomeData:
      type: object
      required: [user, character, activeParty, myQuests, xpForNextLevel, partyGoldReserve]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        character:
          $ref: "#/components/schemas/Character"
        activeParty:
          $ref: "#/components/schemas/PartyOverview"
        myQuests:
          type: array
          items:
            $ref: "#/components/schemas/QuestAssignment"
        activeProject:
          $ref: "#/components/schemas/Project"
        activePartyGoal:
          $ref: "#/components/schemas/PartyGoal"
        xpForNextLevel:
          type: number
        partyGoldReserve:
          type: number
        needsAttention:
          $ref: "#/components/schemas/NeedsAttention"
        catFoleyActive:
          type: boolean

    NeedsAttention:
      type: object
      required: [pendingVerifications, proposedQuests]
      properties:
        pendingVerifications:
          type: number
        proposedQuests:
          type: number

    GiveMeAQuestResult:
      type: object
      required: [hasQuest]
      properties:
        hasQuest:
          type: boolean
        quest:
          $ref: "#/components/schemas/QuestAssignment"
        message:
          type: string

    # ─── PARTY SCHEMAS ─────────────────────────────────────────────────────────
    PartyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    PartyUpdate:
      type: object
      properties:
        name:
          type: string
        routinesPaused:
          type: boolean
        routinesPausedUntil:
          type: ["string", "null"]

    Party:
      type: object
      required: [id, name, householdCode, founderId, memberCount, routinesPaused, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        householdCode:
          type: string
        founderId:
          type: number
        memberCount:
          type: number
        routinesPaused:
          type: boolean
        routinesPausedUntil:
          type: ["string", "null"]
        partyGoldReserve:
          type: number
        myRole:
          type: ["string", "null"]
          enum: [founder, leader, adventurer, null]
        createdAt:
          type: string

    PartyOverview:
      type: object
      required: [id, name, householdCode, myRole, memberCount]
      properties:
        id:
          type: number
        name:
          type: string
        householdCode:
          type: string
        myRole:
          type: string
          enum: [founder, leader, adventurer]
        memberCount:
          type: number
        partyGoldReserve:
          type: number
        routinesPaused:
          type: boolean

    PartyMember:
      type: object
      required: [userId, displayName, role, userType, level]
      properties:
        userId:
          type: number
        displayName:
          type: string
        adventurerName:
          type: ["string", "null"]
